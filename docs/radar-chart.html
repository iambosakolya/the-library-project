<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Радарна діаграма – порівняння LibProj та Goodreads</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #fff;
      }
      .chart-container {
        width: 700px;
        height: 700px;
        padding: 20px;
      }
      h2 {
        text-align: center;
        margin-bottom: 10px;
        font-size: 14pt;
      }
    </style>
  </head>
  <body>
    <div class="chart-container">
      <h2>Порівняння рівня залученості користувачів: LibProj vs Goodreads</h2>
      <canvas id="radarChart"></canvas>
    </div>

    <script>
      const ctx = document.getElementById('radarChart').getContext('2d');

      // Нормалізовані показники (шкала 0–10, де 10 = найкращий результат)
      // Для часових метрик: score = (min_time / actual_time) * 10
      // Для кількісних метрик: score = (actual / max) * 10

      const labels = [
        'Швидкість пошуку\nкниги',
        'Кількість переглянутих\nкниг за сесію',
        'Приєднання\nдо клубів',
        'Швидкість приєднання\nдо клубу',
        'Швидкість отримання\nвраження про книгу',
        'Загальна активність\n(дій за сесію)',
      ];

      const libprojScores = [10, 10, 10, 10, 10, 10];
      const goodreadsScores = [4.0, 4.9, 3.3, 5.0, 0.4, 5.0];

      new Chart(ctx, {
        type: 'radar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'LibProj',
              data: libprojScores,
              backgroundColor: 'rgba(59, 130, 246, 0.2)',
              borderColor: 'rgba(59, 130, 246, 1)',
              borderWidth: 2,
              pointBackgroundColor: 'rgba(59, 130, 246, 1)',
              pointRadius: 4,
            },
            {
              label: 'Goodreads',
              data: goodreadsScores,
              backgroundColor: 'rgba(34, 197, 94, 0.2)',
              borderColor: 'rgba(34, 197, 94, 1)',
              borderWidth: 2,
              pointBackgroundColor: 'rgba(34, 197, 94, 1)',
              pointRadius: 4,
            },
          ],
        },
        plugins: [
          {
            id: 'radarLabels',
            afterDatasetsDraw(chart) {
              const { ctx } = chart;
              const rawValues = [
                ['18 с', '45 с'],
                ['8,6', '4,2'],
                ['2,4', '0,8'],
                ['35 с', '70 с'],
                ['5 с', '120 с'],
                ['24,7', '12,3'],
              ];
              const improvements = [
                '×2,5',
                '×2,0',
                '×3,0',
                '×2,0',
                '×24',
                '×2,0',
              ];

              chart.data.datasets.forEach((dataset, datasetIdx) => {
                const meta = chart.getDatasetMeta(datasetIdx);
                meta.data.forEach((point, idx) => {
                  const { x, y } = point;
                  ctx.save();
                  ctx.font = 'bold 11px Segoe UI';
                  ctx.textAlign = 'center';
                  ctx.fillStyle = dataset.borderColor;
                  const offsetY = datasetIdx === 0 ? -12 : 14;
                  ctx.fillText(rawValues[idx][datasetIdx], x, y + offsetY);
                  ctx.restore();
                });
              });

              // Показати коефіцієнт покращення біля кожної вісі
              const meta0 = chart.getDatasetMeta(0);
              meta0.data.forEach((point, idx) => {
                const { x, y } = point;
                ctx.save();
                ctx.font = 'bold 12px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#16a34a';
                ctx.fillText(improvements[idx], x, y - 26);
                ctx.restore();
              });
            },
          },
        ],
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'left',
              labels: {
                font: { size: 13 },
              },
            },
            tooltip: {
              callbacks: {
                label: function (context) {
                  const idx = context.dataIndex;
                  const raw = [
                    ['18 с', '45 с'],
                    ['8,6', '4,2'],
                    ['2,4', '0,8'],
                    ['35 с', '70 с'],
                    ['5 с', '120 с'],
                    ['24,7', '12,3'],
                  ];
                  const datasetIdx = context.datasetIndex;
                  return (
                    context.dataset.label +
                    ': ' +
                    raw[idx][datasetIdx] +
                    ' (бал: ' +
                    context.raw.toFixed(1) +
                    '/10)'
                  );
                },
              },
            },
          },
          scales: {
            r: {
              beginAtZero: true,
              max: 10,
              min: 0,
              ticks: {
                stepSize: 2,
                font: { size: 11 },
                backdropColor: 'transparent',
              },
              pointLabels: {
                font: { size: 11 },
                padding: 30,
              },
              grid: {
                color: 'rgba(0,0,0,0.1)',
              },
              angleLines: {
                color: 'rgba(0,0,0,0.1)',
              },
            },
          },
        },
      });
    </script>
  </body>
</html>
